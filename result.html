<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的日子 · yshnb</title>
<meta name="description" content="从出生那天到今天，你已经在这颗星球上走过了这么多天。yshnb 做的一个小站。">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#F8F5EF">
<meta property="og:type" content="website">
<meta property="og:site_name" content="yshnb">
<meta property="og:title" content="你已经走过的日子 · yshnb">
<meta property="og:description" content="从出生那天到今天，你和这颗星球一起走过了这么多天。">
<meta property="og:locale" content="zh_CN">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="canonical" href="https://666yu-abc.github.io/yshnb/">
<meta property="og:url" content="https://666yu-abc.github.io/yshnb/">
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="grain"></div>
  <span class="mote" style="--x:11%;--y:26%;--s:4px;--c:var(--sage);--dur:12s;--delay:-1s"></span>
  <span class="mote" style="--x:26%;--y:76%;--s:5px;--c:var(--clay);--dur:14s;--delay:-4s"></span>
  <span class="mote" style="--x:81%;--y:16%;--s:5px;--c:var(--clay);--dur:11s;--delay:-6s"></span>
  <span class="mote" style="--x:90%;--y:66%;--s:3px;--c:var(--sage);--dur:13s;--delay:-2s"></span>
  <span class="mote" style="--x:70%;--y:88%;--s:4px;--c:var(--sage);--dur:15s;--delay:-8s"></span>
  <span class="mote" style="--x:6%;--y:56%;--s:3px;--c:var(--clay);--dur:10s;--delay:-3s"></span>
</div>

<svg class="defs" aria-hidden="true"><symbol id="sprig" viewBox="0 0 160 220">
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 214 C 28 168, 48 128, 78 92 C 96 70, 108 52, 112 30"/>
    <path d="M40 166 C 22 162, 14 142, 34 140 C 48 139, 52 156, 40 166 Z"/>
    <path d="M58 132 C 74 124, 86 136, 74 148 C 64 156, 54 144, 58 132 Z"/>
    <path d="M76 100 C 62 92, 60 74, 78 76 C 90 78, 90 94, 76 100 Z"/>
    <path d="M96 68 C 110 62, 120 76, 106 86 C 96 92, 90 76, 96 68 Z"/>
    <path d="M108 46 C 98 34, 106 20, 120 28 C 128 34, 120 48, 108 46 Z"/>
    <path d="M32 190 C 18 190, 12 176, 28 172"/>
  </g>
</symbol></svg>
<svg class="sprig sprig-left" viewBox="0 0 160 220" aria-hidden="true"><use href="#sprig"/></svg>
<svg class="sprig sprig-right" viewBox="0 0 160 220" aria-hidden="true"><use href="#sprig"/></svg>

<main class="stage">
  <section class="card result-card" aria-labelledby="r-title">
    <div class="card-mark" aria-hidden="true">
      <span class="rule"></span>
      <svg class="sun" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="5.2" stroke="currentColor" stroke-width="1.2"/>
        <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M16 3.5v3.2M16 25.3v3.2M3.5 16h3.2M25.3 16h3.2M7.2 7.2l2.3 2.3M22.5 22.5l2.3 2.3M24.8 7.2l-2.3 2.3M9.5 22.5l-2.3 2.3"/>
        </g>
      </svg>
      <span class="rule"></span>
    </div>

    <p class="eyebrow">Days on Earth &middot; yshnb</p>
    <h1 class="result-title" id="r-title">你已经在这颗蓝色星球上，<br>生活了</h1>

    <div class="number-wrap">
      <span class="big-number" id="days" aria-live="polite">0</span>
      <span class="unit">天</span>
    </div>

    <p class="birth-line">从 <time id="birth-date"></time> 起，到 <time id="today-date"></time></p>
    <p class="count-note">（把出生那天和今天，都算进去了）</p>

    <div class="divider" aria-hidden="true"><span class="divider-mark"></span></div>
    <blockquote class="quote" id="quote"></blockquote>

    <div class="mini-facts">
      <div class="fact">
        <span class="fact-num" id="age"></span>
        <span class="fact-label">已经走过的年岁</span>
      </div>
      <div class="fact">
        <span class="fact-num" id="next-bday"></span>
        <span class="fact-label" id="next-label">天后是下一个生日</span>
      </div>
    </div>

    <div class="actions">
      <button class="ghost-btn" id="copy-btn" type="button">复制这份日子</button>
      <a class="text-link" href="index.html">重新选一个日子 &nearr;</a>
    </div>

    <p class="foot-note">往后的日子，也请慢慢来。</p>
  </section>

  <footer class="site-footer">
    <span>yshnb</span><span class="dot">&middot;</span><span>Days on Earth</span>
  </footer>
</main>

<div class="toast" id="toast" role="status">链接已复制，可以把这份日子分享出去啦</div>
<script src="result.js"></script>
</body>
</html>
